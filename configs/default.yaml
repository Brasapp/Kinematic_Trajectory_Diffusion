# ============================================================
# Kinematic-Guided Trajectory Diffusion — Default Configuration
# ============================================================

data:
  data_dir: "data/"                # Directory containing raw .bin ArduPilot logs
  output_dir: "outputs_3feat/"           # Generated trajectory CSVs saved here
  checkpoint_dir: "checkpoints_3feat/"   # Model weight snapshots saved here
  sequence_length: 256             # Fixed window length (samples) for each trajectory segment
  features: 3                      # [roll, pitch, alt]
  feature_names: [roll, pitch, alt]  # Model channels, picked from data_parser.FULL_COLUMNS
  resample_hz: 10.0                # Uniform grid rate; dt = 1 / resample_hz
  modes: [AUTO, STABILIZE, MANUAL, RTL, CIRCLE, FBWA, FBWB, CRUISE, LOITER]  # flight modes to keep (AUTO alone gives only ~11 min)
  min_speed_ms: 10.0               # Drop samples slower than this (on the ground / taxiing)
  max_gap_s: 0.3                   # Drop stretches where the log is sparser than this
  gps_timeout_s: 1.0               # Drop samples without a GPS 3D fix in the last N seconds
  max_pos_jump_m: 3.0              # Drop EKF resets (position step vs velocity mismatch)
  min_mission_samples: 256         # Minimum resampled samples per segment (>= sequence_length)
  stride: 128                      # Sliding window stride (overlap = sequence_length - stride)

diffusion:
  T: 1000                          # Total forward-process timesteps
  s: 0.008                         # Cosine schedule offset (Nichol & Dhariwal 2021, Appendix B)
  guidance_scale: 2.0              # w: kinematic guidance strength
  lambda_vel: 0.1                  # weight of velocity-change penalty
  lambda_pitch: 1.0                # Weight for pitch-altitude correlation
  lambda_roll: 0.5                 # Weight for roll smoothness

model:
  in_channels: 3                   # Must match data.features
  base_channels: 64                # Width of the shallowest U-Net level
  depth: 3                         # Number of encoder/decoder stages
  time_emb_dim: 128                # Dimension of sinusoidal time embedding

training:
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-5
  epochs: 200
  checkpoint_every: 10             # Save model every N epochs
  num_workers: 4
  seed: 42
  grad_clip: 1.0                   # Gradient clipping max norm
  lambda_smooth: 0.1               # Weight for predicted x_0 smoothness loss

sampling:
  num_samples: 8                   # Number of trajectories to generate per run
  ddim_steps: 50                   # DDIM inference steps (fast; S << T)
  eta: 0.0                         # DDIM stochasticity: 0 = deterministic, 1 = DDPM-equivalent
  output_csv: "outputs_3feat/generated_trajectories.csv"
